# Dependabot opens PRs for outdated or vulnerable dependencies. Each PR runs the
# test suite in CI; merging one deploys like any other change, so read the
# changelog for major-version bumps before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
